<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloudflare Matrix</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">OC <span>//</span> CLOUDFLARE-MATRIX</div>

    <div class="badges">
      <span class="badge" id="badge-egress"><i></i>EGRESS-BUS</span>
      <span class="badge" id="badge-instabox"><i></i>INSTABOX</span>
      <span class="badge" id="badge-host"><i></i>HOST</span>
    </div>

    <nav class="filters" id="filters" aria-label="槽位过滤">
      <button class="filter active" data-filter="ALL" type="button">ALL</button>
      <button class="filter" data-filter="ACTIVE" type="button">ACTIVE</button>
      <button class="filter" data-filter="COOLDOWN" type="button">COOLDOWN</button>
      <button class="filter" data-filter="QUARANTINED" type="button">QUARANTINED</button>
    </nav>

    <div class="actions">
      <button class="btn btn-primary" id="btn-add" type="button">+ 新增槽位账号</button>
      <button class="btn" id="btn-verify" type="button">全量验活</button>
      <button class="btn" id="btn-deploy" type="button">多态部署 Worker</button>
    </div>
  </header>

  <main id="grid" class="grid" aria-live="polite"></main>

  <footer class="statusline">
    <span id="conn-text">连接中…</span>
    <span id="last-sync"></span>
  </footer>

  <div id="modal-root"></div>
  <div id="toast-root" class="toasts"></div>

  <script src="./main.js"></script>
</body>
</html>
